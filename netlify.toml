# Netlify Configuration File
# This file configures your Netlify site deployment

[build]
  # No build command needed for static site
  publish = "."

[functions]
  # Directory where serverless functions are located
  directory = "netlify/functions"
  # Node.js version for functions
  node_bundler = "esbuild"

# Form submission handling
# Netlify Forms will automatically trigger the function when a form is submitted
# Functions are automatically detected and built by Netlify - no plugin needed

# Environment variables (set these in Netlify Dashboard > Site settings > Environment variables)
# Required for email notifications:
# - NOTIFICATION_EMAIL: Your email address to receive form submissions
# - SENDGRID_API_KEY: (Optional) For SendGrid email service
# - MAILGUN_API_KEY: (Optional) For Mailgun email service
# - MAILGUN_DOMAIN: (Optional) For Mailgun email service

# Redirects
[[redirects]]
  from = "/thank-you"
  to = "/thank-you.html"
  status = 200

[[redirects]]
  from = "/thank-you/"
  to = "/thank-you.html"
  status = 200

[[redirects]]
  from = "/datenschutz"
  to = "/datenschutz.html"
  status = 200

[[redirects]]
  from = "/datenschutz/"
  to = "/datenschutz.html"
  status = 200

[[redirects]]
  from = "/privacy"
  to = "/datenschutz.html"
  status = 200

[[redirects]]
  from = "/privacy-policy"
  to = "/datenschutz.html"
  status = 200

# HTTP Headers for Video Performance Optimization
# These headers improve video loading times and enable proper streaming

# Headers for video files (.mov, .mp4, .webm)
[[headers]]
  for = "/*.mov"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
    Accept-Ranges = "bytes"
    Content-Type = "video/quicktime"
    X-Content-Type-Options = "nosniff"

[[headers]]
  for = "/*.mp4"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
    Accept-Ranges = "bytes"
    Content-Type = "video/mp4"
    X-Content-Type-Options = "nosniff"

# Headers for all video files (catch-all)
[[headers]]
  for = "/*.webm"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
    Accept-Ranges = "bytes"
    Content-Type = "video/webm"
    X-Content-Type-Options = "nosniff"

# Headers for images (optimize gallery loading)
[[headers]]
  for = "/*.jpg"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.jpeg"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.png"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.webp"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
    Content-Type = "image/webp"

[[headers]]
  for = "/*.avif"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
    Content-Type = "image/avif"

# Headers for CSS and JS (enable caching with revalidation - since files aren't hashed)
# Note: For production, consider adding file hashing to enable immutable caching
[[headers]]
  for = "/*.css"
  [headers.values]
    Cache-Control = "public, max-age=604800, must-revalidate"

[[headers]]
  for = "/*.js"
  [headers.values]
    Cache-Control = "public, max-age=604800, must-revalidate"

# Headers for fonts (long cache)
[[headers]]
  for = "/*.woff"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.woff2"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Headers for HTML files (no cache to ensure latest version always loads)
[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "no-store, no-cache, must-revalidate, proxy-revalidate"
    Pragma = "no-cache"
    Expires = "0"
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    X-XSS-Protection = "1; mode=block"

# Headers for other HTML files (shorter cache, allow revalidation)
[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=300, must-revalidate"
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    X-XSS-Protection = "1; mode=block"

# Headers for poster images (video thumbnails)
[[headers]]
  for = "/*-poster.jpg"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
    Content-Type = "image/jpeg"

# All changes are deployed and ready

